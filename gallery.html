    <link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@400;600;800&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            height: 250px;
            background: var(--light-gray);
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(6, 78, 59, 0.8);
            color: white;
            padding: 15px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .gallery-item:hover .gallery-overlay {
            transform: translateY(0);
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            animation: zoom 0.3s;
        }
        @keyframes zoom {
            from {transform:scale(0)} 
            to {transform:scale(1)}
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover {
            color: var(--secondary-color);
        }
        .modal-prev, .modal-next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -25px;
            color: white;
            font-weight: bold;
            font-size: 30px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            -webkit-user-select: none;
            background-color: rgba(0, 0, 0, 0.4);
            border: none;
            z-index: 2001;
        }
        .modal-prev {
            left: 0;
        }
        .modal-next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }
        .modal-prev:hover, .modal-next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <button class="modal-prev" id="modalPrev">&#10094;</button>

    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImg");
            const closeBtn = document.querySelector(".close-modal");
            const items = document.querySelectorAll(".gallery-item img");
            const prevBtn = document.getElementById("modalPrev");
            const nextBtn = document.getElementById("modalNext");

            let currentIndex = 0;
            const images = Array.from(items);

            function showImage(index) {
                if (index >= images.length) {
                    currentIndex = 0;
                } else if (index < 0) {
                    currentIndex = images.length - 1;
                } else {
                    currentIndex = index;
                }
                modalImg.src = images[currentIndex].src;
            }

            images.forEach((img, index) => {
                img.addEventListener("click", function() {
                    modal.style.display = "block";
                    showImage(index);
                });
            });

            closeBtn.addEventListener("click", () => {
                modal.style.display = "none";
            });

            modal.addEventListener("click", (e) => {
                if(e.target === modal) {
                    modal.style.display = "none";
                }
            });

            prevBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                showImage(currentIndex - 1);
            });

            nextBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                showImage(currentIndex + 1);
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (modal.style.display === "block") {
                    if (e.key === "ArrowLeft") showImage(currentIndex - 1);
                    if (e.key === "ArrowRight") showImage(currentIndex + 1);
                    if (e.key === "Escape") modal.style.display = "none";
                }
            });

            // Swipe navigation
            let touchstartX = 0;
            let touchendX = 0;

            modal.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, {passive: true});

            modal.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleSwipe();
            }, {passive: true});

            function handleSwipe() {
                if (touchendX < touchstartX - 50) showImage(currentIndex + 1); // Swiped left
                if (touchendX > touchstartX + 50) showImage(currentIndex - 1); // Swiped right
            }
        });
    </script>
